<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
    <title>BOFUL</title>
</head>

<body>
    <div class="topbutton centered-buttons">
        <button class="darkmode" id="darkmode" onclick="toggleDarkMode()" disabled title="Toggle Dark/Light Mode"><i
                class="fa fa-moon"></i></button>
        <button class="mutemode" id="mute" onclick="toggleMute()" title="Mute Popups"><i
                class="fa fa-bell"></i></button>
        <button class="redraw" id="redraw"
            title="Show a card that has a SET. Your streak cannot go up after using this.">Reroll</button>
        <div class="word-display" id="word-display" contenteditable="false"></div>
        <button class="find-set" id="submit" disabled
            title="Shows you a Set. This will reset your streak.">Complete</button>
        <button class="showrules" id="rules" onclick="showRules()" title="Show The Rules"><i
                class="fa fa-question"></i></button>
        <button class="opendrawer" id="openDrawer">Book</button>
    </div>

    <div class="centered-streaks" id="streaks">
        <span class="set-streak" id="setStreak">0</span>
        <span class="sets-found" id="setsFound">0</span>
    </div>

    <div class="block-container" id="block-container"></div>

    <div id="popupOverlay" class="popup-overlay" onclick="closePopup()">
        <div class="popup-window" onclick="event.stopPropagation();">
            <button class="popup-close" style="color: white;" onclick="closePopup()">×</button>
            <div id="popupContent" class="popup-content"></div>
        </div>
    </div>

    <span class="output" id="output"></span>

    <dialog id="rightDrawer" class="drawer">
        <div class="drawer-body">
            <p style="background-color: transparent; font-size: medium; cursor: default;"><strong>Total Score:</strong> <span id="totalScore">0</span></p>
            <button id="closeDrawer">&times;</button>
        </div>
        <header class="drawer-header">
            <h2>Found Words</h2>
            <div id="wordList">
            </div>
        </header>

    </dialog>

    <template id="block-template">
        <div class="block">
            <p class="block-text"></p>
        </div>
    </template>
</body>

</html>
